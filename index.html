<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ITI Fitter Study Hub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{--bg:#eceff2;--sf:#fff;--ink:#1b2630;--mute:#5c6b78;--line:#d3dae1;--hd:#1f2d3a;--hdi:#fff;--ac:#f2b705;--aci:#1b2630;--ok:#1e8e4e;--bad:#c93a3a;--bl:#2f5f8f;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181f;--sf:#192530;--ink:#e6edf3;--mute:#93a3b1;--line:#2a3a48;--hd:#0b1218;--ok:#47c27c;--bad:#ff7b7b;--bl:#7fb0e0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10181f;--sf:#192530;--ink:#e6edf3;--mute:#93a3b1;--line:#2a3a48;--hd:#0b1218;--ok:#47c27c;--bad:#ff7b7b;--bl:#7fb0e0;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,-apple-system,Segoe UI,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;margin:0}
header{background:var(--hd);color:var(--hdi);position:sticky;top:env(safe-area-inset-top,0px);z-index:9}
.top{max-width:760px;margin:0 auto;padding:12px 16px 6px}
h1{font-size:28px}.top p{margin:0;color:#aebccb;font-size:14px}
nav{display:flex;gap:6px;overflow-x:auto;max-width:760px;margin:0 auto;padding:6px 16px 10px;scrollbar-width:none}
nav button{flex:none;font:inherit;font-weight:600;font-size:14px;border:1px solid #3a4b5b;background:none;color:#d4dee8;border-radius:999px;padding:8px 14px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--ac);color:var(--aci);border-color:var(--ac)}
main{max-width:760px;margin:0 auto;padding:16px 16px 48px}
h2{font-size:24px;margin:4px 0 12px}
details,.card{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:0;margin-bottom:10px}
.card{padding:16px}
summary{cursor:pointer;padding:14px 16px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:8px}
summary::after{content:"+";color:var(--mute);font-size:20px;line-height:1}
details[open] summary::after{content:"\2212"}
.b{padding:0 16px 14px}.b ul,.b ol{margin:6px 0;padding-left:20px}.b li{margin:3px 0}
.note{border-left:4px solid var(--ac);padding:6px 10px;margin:8px 0;background:var(--bg);border-radius:0 8px 8px 0}
.f{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.f:first-child{border-top:0}.f code{font:600 15px ui-monospace,Menlo,Consolas,monospace;color:var(--bl)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:14px;color:var(--mute);margin:8px 0 3px}
input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 16px;cursor:pointer;background:var(--ac);color:var(--aci)}
.btn.s{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.res{margin-top:10px;padding:10px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-weight:600}
:focus-visible{outline:3px solid var(--bl);outline-offset:2px}
.svgw{overflow-x:auto}.svgw svg{width:100%;min-width:320px;height:auto;display:block}
svg text{fill:var(--ink);font:12px Barlow,sans-serif}svg .l{stroke:var(--ink);fill:none;stroke-width:1.5}svg .fl{fill:var(--line);stroke:var(--ink);stroke-width:1.5}svg .ac{fill:var(--ac);stroke:var(--ink);stroke-width:1.5}svg .bl{fill:var(--bl);opacity:.55;stroke:var(--ink);stroke-width:1.5}
.opt{display:block;width:100%;text-align:left;font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0;cursor:pointer}
.opt.sel{border-color:var(--bl);outline:2px solid var(--bl)}.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--bg))}.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--bg))}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-weight:600}
.pal{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.pal button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.pal .a{background:var(--ok);color:#fff;border-color:var(--ok)}.pal .m{background:var(--bl);color:#fff}.pal .c{outline:3px solid var(--ac)}
.nr{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.big{font:700 44px/1 "Barlow Condensed",sans-serif}
.sub{color:var(--mute);font-size:14px}
</style>
</head>

["Safety in the workshop","<ul><li>Wear safety shoes, goggles and a close-fitting apron. Tie long hair back.</li><li>Never use a file without a handle. Never leave tools on the edge of the bench.</li><li>Clamp work firmly in the vice. Keep the floor clean and dry.</li><li>Fire extinguishers: water for paper and wood, foam for oil, CO\u2082 for electrical fires, dry powder for metal fires.</li><li>Report every injury to the instructor, however small.</li></ul>"],
["Measuring instruments","<ul><li><b>Steel rule:</b> reads to 0.5 mm or 1 mm.</li><li><b>Vernier caliper:</b> least count 0.02 mm. Measures outside, inside and depth.</li><li><b>Micrometer:</b> least count 0.01 mm. Pitch of its screw is 0.5 mm.</li><li><b>Try square:</b> checks 90\u00b0. <b>Bevel protractor:</b> measures angles, least count 5 minutes.</li><li><b>Feeler gauge:</b> measures small gaps. <b>Dial test indicator:</b> checks run-out and alignment.</li></ul><div class='note'>Always clean the instrument and check for zero error before measuring.</div>"],
["Marking and layout","<ul><li><b>Surface plate:</b> a flat cast iron or granite table that gives a true reference surface.</li><li><b>Scriber:</b> hardened steel pointer that draws fine lines. <b>Surface gauge:</b> scribes lines at a set height.</li><li><b>Dividers and trammel:</b> mark circles and arcs. <b>Centre punch:</b> 90\u00b0 point, marks drill centres. <b>Prick punch:</b> 30\u00b0 point, marks layout lines.</li><li>Apply marking blue or Prussian blue so lines show clearly.</li></ul>"],
["Hand tools: files, hacksaw, chisels","<ul><li><b>File grades</b> from coarse to fine: rough, bastard, second cut, smooth, dead smooth.</li><li><b>File cuts:</b> single cut (soft metals, finishing), double cut (general), rasp cut (wood and leather).</li><li><b>File shapes:</b> flat, hand, square, round, half round, triangular, knife edge.</li><li><b>Hacksaw blade:</b> 14 to 32 teeth per inch. Use fine blades (24 or 32 TPI) for thin sheet, tubes and hard metal. At least 3 teeth should touch the work.</li><li><b>Chisels:</b> flat, cross-cut, half round, diamond point. Cutting angle about 60\u00b0 for mild steel, 30\u201340\u00b0 for soft metals.</li></ul>"],
["Drilling","<ul><li><b>Twist drill parts:</b> point, flutes, lips, web, margin, body, shank, tang.</li><li>Point angle: 118\u00b0 for mild steel. Lip clearance angle: 12\u201315\u00b0.</li><li>Larger drill, lower speed. Harder metal, lower speed.</li><li><b>Reamer:</b> finishes a drilled hole to an accurate size. <b>Counterbore, countersink:</b> make seats for screw heads.</li></ul>"],

["Limits, fits and tolerances","<ul><li><b>Basic size:</b> nominal size. <b>Limits:</b> maximum and minimum permitted sizes.</li><li><b>Tolerance:</b> upper limit \u2212 lower limit. <b>Allowance:</b> intended difference between mating parts.</li><li><b>Clearance fit:</b> shaft always smaller than hole (free to turn).</li><li><b>Interference fit:</b> shaft always larger than hole (press fit).</li><li><b>Transition fit:</b> may give either clearance or interference.</li><li><b>Hole basis system:</b> hole size is fixed, shaft size is varied. It is preferred because holes are harder to make exactly.</li></ul>"],
["Engineering materials","<ul><li><b>Cast iron:</b> brittle, good in compression, easy to cast.</li><li><b>Mild steel:</b> 0.15\u20130.3% carbon, tough and easy to work. <b>High carbon steel:</b> 0.6\u20131.5% carbon, hard, used for tools.</li><li><b>HSS:</b> cutting tool steel that keeps its hardness at high heat.</li><li><b>Brass:</b> copper + zinc. <b>Bronze:</b> copper + tin.</li><li><b>Heat treatment:</b> annealing softens, hardening makes hard and brittle, tempering reduces brittleness.</li></ul>"],
["Threads and fasteners","<ul><li><b>ISO metric thread:</b> 60\u00b0. <b>Whitworth (BSW):</b> 55\u00b0. <b>Acme:</b> 29\u00b0. Square and buttress threads carry heavy loads.</li><li><b>Pitch:</b> distance between adjacent threads. <b>Lead:</b> advance in one turn = pitch \u00d7 number of starts.</li><li>Fasteners: bolt, nut, stud, set screw, washer, split pin, key.</li><li>Standard threads are right hand. A left-hand thread tightens when turned anticlockwise.</li></ul>"]

["Filing a flat surface","<ol><li>Grip the work firmly in the vice with the surface just above the jaws.</li><li>Choose a bastard file for roughing, a smooth file for finishing.</li><li>Stand steady and push the file with even pressure on the forward stroke only.</li><li>Cross-file to remove metal, then draw-file for a fine finish.</li><li>Check flatness with a straight edge and squareness with a try square.</li></ol>"],

function calcs(){
 function v(i){return parseFloat($(i).value);}
 $("cb").onclick=function(){var V=v("cv"),D=v("cd");$("cr").textContent=(V>0&&D>0)?"N = "+Math.round(1000*V/(Math.PI*D))+" rpm":"Enter V and D as positive numbers.";};

 var m=$("m");
 if(P.i>=Q.length){m.innerHTML='<h2>Practice MCQs</h2><div class="card"><div class="big">'+P.s+' / '+Q.length+'</div><p class="sub">Practice round complete.</p><button class="btn" id="rs">Practice again</button></div>';$("rs").onclick=function(){P={i:0,s:0,done:false,pick:null};practice();};return;}
 var q=Q[P.i];
 m.innerHTML='<h2>Practice MCQs</h2><div class="card"><div class="bar"><span>Question '+(P.i+1)+' of '+Q.length+'</span><span>Score '+P.s+'</span></div><p><b>'+esc(q[0])+'</b></p>'+
 q[1].map(function(o,k){var c="opt";if(P.done){if(k===q[2])c+=" ok";else if(k===P.pick)c+=" no";}return '<button class="'+c+'" data-k="'+k+'"'+(P.done?' disabled':'')+'>'+esc(o)+'</button>';}).join("")+
 '<div class="nr">'+(P.done?'<button class="btn" id="nx">'+(P.i===Q.length-1?'See score':'Next question')+'</button>':'')+'</div></div>';
 Array.prototype.forEach.call(m.querySelectorAll(".opt"),function(b){b.onclick=function(){P.pick=+b.getAttribute("data-k");P.done=true;if(P.pick===q[2])P.s++;practice();};});
 if($("nx"))$("nx").onclick=function(){P.i++;P.done=false;P.pick=null;practice();};
}

/* CBT mock */
var C=null,timer=null;
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmt(s){var m=Math.floor(s/60),x=s%60;return (m<10?"0":"")+m+":"+(x<10?"0":"")+x;}
function stop(){if(timer){clearInterval(timer);timer=null;}}
function mockStart(){
 $("m").innerHTML='<h2>CBT Mock Test</h2><div class="card"><p>'+Q.length+' questions, 20 minutes, one mark each, no negative marking. Use the question palette to jump around and mark questions for review, like the real CBT screen.</p><button class="btn" id="go">Start test</button></div>';
 $("go").onclick=function(){C={o:shuffle(Q.map(function(_,i){return i;})),a:{},mk:{},i:0,t:1200,fin:false};stop();timer=setInterval(function(){C.t--;var e=$("tm");if(e)e.textContent=fmt(C.t);if(C.t<=0)finish();},1000);mock();};
}
function mock(){
 if(C.fin)return;
 var q=Q[C.o[C.i]],m=$("m");
 m.innerHTML='<div class="bar"><span>Question '+(C.i+1)+' of '+C.o.length+'</span><span>Time left <span id="tm">'+fmt(C.t)+'</span></span></div><div class="card"><p><b>'+esc(q[0])+'</b></p>'+
 q[1].map(function(o,k){return '<button class="opt'+(C.a[C.i]===k?' sel':'')+'" data-k="'+k+'">'+esc(o)+'</button>';}).join("")+
 '<div class="nr"><button class="btn s" id="pv"'+(C.i===0?' disabled':'')+'>Previous</button><button class="btn s" id="mk">'+(C.mk[C.i]?'Unmark':'Mark for review')+'</button><button class="btn s" id="cl">Clear</button><button class="btn" id="nx"'+(C.i===C.o.length-1?' disabled':'')+'>Next</button></div></div>'+
 '<div class="card"><div class="sub">Palette: green answered, blue marked</div><div class="pal">'+C.o.map(function(_,i){return '<button data-i="'+i+'" class="'+(C.a[i]!==undefined?'a ':'')+(C.mk[i]?'m ':'')+(i===C.i?'c':'')+'" aria-label="Go to question '+(i+1)+'">'+(i+1)+'</button>';}).join("")+'</div><button class="btn" id="sb">Submit test</button></div>';
 Array.prototype.forEach.call(m.querySelectorAll(".opt"),function(b){b.onclick=function(){C.a[C.i]=+b.getAttribute("data-k");mock();};});
 Array.prototype.forEach.call(m.querySelectorAll(".pal button"),function(b){b.onclick=function(){C.i=+b.getAttribute("data-i");mock();};});
 $("pv").onclick=function(){C.i--;mock();};$("nx").onclick=function(){C.i++;mock();};
 $("cl").onclick=function(){delete C.a[C.i];mock();};$("mk").onclick=function(){C.mk[C.i]=!C.mk[C.i];mock();};
 $("sb").onclick=function(){var n=C.o.length-Object.keys(C.a).length;if(!n||confirm(n+" question(s) are unanswered. Submit anyway?"))finish();};
}
function finish(){
 stop();C.fin=true;var s=0,w=[];
 C.o.forEach(function(qi,i){var q=Q[qi];if(C.a[i]===q[2])s++;else w.push('<div class="f"><span><b>'+esc(q[0])+'</b><br><span class="sub">'+(C.a[i]===undefined?'Not answered':'Your answer: '+esc(q[1][C.a[i]]))+'</span></span><code>'+esc(q[1][q[2]])+'</code></div>');});
 var pct=Math.round(s/C.o.length*100);
 $("m").innerHTML='<h2>CBT Mock Result</h2><div class="card"><div class="big">'+s+' / '+C.o.length+'</div><p class="sub">'+pct+'% \u00b7 '+(pct>=70?'Strong. Keep revising weak topics.':pct>=40?'Fair. Review the theory and formulas, then retry.':'Needs work. Study the Theory and Practical tabs, then retry.')+'</p><button class="btn" id="rt">Take another test</button></div>'+(w.length?'<div class="card"><h3>Review: wrong or skipped</h3>'+w.join("")+'</div>':'<div class="card">Perfect score. No wrong answers to review.</div>');
 $("rt").onclick=mockStart;
}

function show(){
 var m=$("m");if(cur!==5)stop();
 if(cur===0)m.innerHTML='<h2>Complete Theory</h2>'+acc(TH);
 else if(cur===1)m.innerHTML='<h2>Practical Knowledge</h2>'+acc(PR);
 else if(cur===2)m.innerHTML=DG;
 else if(cur===3){m.innerHTML=FMH;calcs();}
 else if(cur===4)practice();
 else{if(C&&!C.fin)mock();else mockStart();}
 Array.prototype.forEach.call($("nav").children,function(b,i){b.setAttribute("aria-selected",i===cur);});
 window.scrollTo(0,0);
}
$("nav").innerHTML=TABS.map(function(t,i){return '<button role="tab" data-i="'+i+'">'+t+'</button>';}).join("");
$("nav").onclick=function(e){var i=e.target.getAttribute&&e.target.getAttribute("data-i");if(i===null||i===undefined)return;cur=+i;show();};
show();
})();
</script>
</body>
</html>
